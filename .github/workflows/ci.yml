name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint & test (py${{ matrix.python-version }})
    # Ubuntu ships systemd, so systemd-analyze is present and calendar
    # expressions get validated for real (unlike on a dev machine without it).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        # No floating v8 major tag is published; pin the exact latest v8 release.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project (dev extras + tooling group)
        # `[dev]` covers runtime test deps (pytest, ruff); the dependency-group
        # `dev` adds audit/lint tools (pip-audit, pylint) defined in PEP 735
        # [dependency-groups]. Installing both keeps everything available
        # whether tools are referenced from extras or groups.
        run: |
          uv pip install -e ".[dev]"
          uv pip install --group dev || true

      - name: Confirm systemd-analyze is available
        run: systemd-analyze calendar "*-*-* 07:00:00"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    # Soft gate: report any dependency CVEs but don't block merges yet, so
    # transient upstream advisories don't immediately fail CI.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Create virtualenv
        run: uv venv --python 3.12

      - name: Install project and audit tooling
        run: |
          uv pip install -e ".[dev]"
          uv pip install pip-audit

      - name: Run pip-audit
        run: uv run pip-audit --strict
