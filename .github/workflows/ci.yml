name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast instead of hanging if PyPI is slow.
  UV_HTTP_TIMEOUT: "120"

jobs:
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        # No floating v8 major tag is published; pin the exact latest v8 release.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install project and dev tooling
        run: uv sync --python 3.12 --group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        # Paths come from [tool.mypy] files = ["src", "tests"].
        run: uv run --no-sync mypy

  test:
    name: test (py${{ matrix.python-version }})
    # Ubuntu ships systemd, so systemd-analyze is present and calendar
    # expressions get validated for real (unlike on a dev machine without it).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install project and dev tooling
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Confirm systemd-analyze is available
        run: systemd-analyze calendar "*-*-* 07:00:00"

      - name: Run tests
        run: uv run --no-sync pytest

  minimum-versions:
    name: test (oldest supported deps)
    # The floors in [project.dependencies] are a promise; resolve to them and
    # run the suite so the promise stays true. This also covers the real-click
    # import path in cli.main, which typer >= 0.26 replaces with typer._click.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install oldest permitted direct dependencies
        run: uv sync --python 3.12 --group dev --resolution lowest-direct

      - name: Run tests
        # Linters are deliberately not run here: an old ruff flags a different
        # rule set, which says nothing about whether the floors are usable.
        run: uv run --no-sync pytest

  build:
    name: build & install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install the built wheel into a clean environment
        # Catches packaging regressions the editable install hides: a missing
        # module, a broken console script, or a dropped py.typed marker.
        run: |
          uv venv --python 3.12 /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl

      - name: Smoke-test the console script
        run: |
          /tmp/smoke/bin/wfctl --version
          /tmp/smoke/bin/wfctl --help
          test -f /tmp/smoke/lib/python3.12/site-packages/wfctl/py.typed

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    # Soft gate: report any dependency CVEs but don't block merges yet, so
    # transient upstream advisories don't immediately fail CI.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install project and audit tooling
        run: uv sync --python 3.12 --group dev

      - name: Run pip-audit
        # No --strict: wfctl itself isn't on PyPI yet, so pip-audit can't
        # audit the local editable install and would error in strict mode.
        # Real CVEs in dependencies still fail the step.
        run: uv run --no-sync pip-audit
