[project]
name = "wfctl"
version = "0.1.0"
description = "Declarative workflow controller that reconciles YAML definitions into managed systemd --user units."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mike Preston", email = "darkflib@gmail.com" }]
keywords = ["systemd", "workflow", "automation", "timer", "reconciler"]
dependencies = [
    # Floors are the oldest releases CI actually exercises (see the
    # `minimum-versions` job, which resolves --resolution lowest-direct).
    # typer >= 0.26 vendors click as `typer._click`; cli.main supports both
    # layouts, and the floor below keeps the real-click path covered too.
    "typer>=0.19",
    "rich>=14.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
]

[project.scripts]
wfctl = "wfctl.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfctl"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "PRD.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented pattern puts Option/Argument calls in parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# typer >= 0.26 vendors click, so a real `click` distribution may be absent.
# cli.main imports it inside a try/except for the older layout.
module = ["click.*"]
ignore_missing_imports = true

[dependency-groups]
# PEP 735 groups: the single home for developer tooling. `uv sync` installs
# the `dev` group by default; CI installs it explicitly via --group dev.
dev = [
    "mypy>=1.15",
    "pip-audit>=2.10.0",
    "pytest>=8.3",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12",
]
